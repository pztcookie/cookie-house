  g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (vertical) { const cs = [...text]; size = Math.min(size, (h * 0.88) / (cs.length * 1.05)); g.font = font(size); cs.forEach((c, i) => g.fillText(c, w / 2, h / 2 + (i - (cs.length - 1) / 2) * size * 1.05)); }
  else { g.font = font(size); while (g.measureText(text).width > w * fit && size > 10) { size -= 2; g.font = font(size); } g.fillText(text, w / 2, h / 2 + 4); }
}

function checkout() {
  if (meal.active || ride.busy || coastExperience?.busy() || teaExperience?.busy() || wharfExperience?.busy()) return;
  const list = [...store.basket].map(itemById);
  if (!list.length) { toast(T('toastEmpty')); return; }
  const total = list.reduce((a, b) => a + b.price, 0);
  if (store.coins < total) { toast(T('toastShort', total - store.coins)); tone(300, 0, 0.25, 'sine', 0.1, 0.8); return; }
  const oldCoins=store.coins,oldBought=new Set(store.bought),oldToys=store.toys;

  list.filter(it => !it.consumable).forEach(it => { store.bought.add(it.id); it.homeObj.visible = true; burst(it.homeObj.position.clone().add(V(0, 0.3, 0)), 'heart', 5); });

}

  roof.children.forEach(o => (o.castShadow = roofT > 0.5));

  shopRoofs.forEach(r => { const want = mode !== 'approach' && ((mode === 'orbit' && space === r.id) || inR(r.rect, tg.x, tg.z)) ? 0 : 1; r.t += (want - r.t) * Math.min(1, dt * 4);
    r.mats.forEach(m => (m.opacity = r.t)); r.group.visible = r.t > 0.02; });
  escTex.offset.y -= dt * 0.35;
  coinTimer -= dt; if (coinTimer < 0) { if (coins.length < 7) spawnCoin(); coinTimer = 6; }
  coins.forEach(c => { c.position.y = 0.5 + Math.sin(t * 3 + c.userData.ph) * 0.08; });
  if (mode === 'follow') { const c = chars[controlled]; for (const k of coins.slice()) if (c.y < 0.6 && Math.hypot(k.position.x - c.x, k.position.z - c.z) < 0.7) collectCoin(k); }
  ITEMS.forEach(it => { if (it.bounce > 0) { it.bounce = Math.max(0, it.bounce - dt); it.shopObj.position.y = it.shop[1] + Math.abs(Math.sin(it.bounce * 14)) * it.bounce * 0.4; } });
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('#toast').hidden = true; }
  nightT += ((night ? 1 : 0) - nightT) * Math.min(1, dt * 1.8); applyNight(nightT);

  const near = chars.some(c => !c.carried && c.y > 2.7 && Math.hypot(c.x + 2.1, c.z - 0.5) < 1.5);
  doorT += ((near || (mode === 'orbit' && space === 'pool') ? 1 : 0) - doorT) * Math.min(1, dt * 5);
  doorPivot.rotation.y = doorT * 1.45;

  swingPivot.rotation.x = Math.sin(t * 1.3) * 0.18;
  waterTex.offset.set(t * 0.02, t * 0.013);
  floatRing.position.y = F1 + 0.52 + Math.sin(t * 1.6) * 0.03; floatRing.position.x = -5.8 + Math.sin(t * 0.3) * 0.5;
  fanBlades.rotation.z -= dt * 9;
  lavaBlobs.forEach((b, i) => { b.position.y = 0.42 + (Math.sin(t * 0.6 + i * 2.1) * 0.5 + 0.5) * 0.36; b.position.x = 2.55 + Math.sin(t * 0.9 + i) * 0.03; });
  for (let i = 0; i < PET; i++) {
    petPos[i * 3 + 1] -= dt * (0.35 + (petSeed[i] % 1) * 0.3);
    petPos[i * 3] += Math.sin(t * 1.2 + petSeed[i]) * dt * 0.35 + dt * 0.12;
    if (petPos[i * 3 + 1] < 0.05) { petPos[i * 3] = -9.4 + (Math.random() - 0.5) * 3.5; petPos[i * 3 + 1] = 3 + Math.random() * 2; petPos[i * 3 + 2] = -2.6 + (Math.random() - 0.5) * 3.5; }
  }
  petGeo.attributes.position.needsUpdate = true;
  // city life
  tramTick(dt);
  tramState.hop = Math.max(0, tramState.hop - dt); tramBody.position.y = tramPaused()?0:Math.sin(tramState.hop * 12) * tramState.hop * 0.6 + Math.abs(Math.sin(t * 8)) * 0.03;
  puppy.position.y = 25 + Math.sin(t * 0.6) * 0.8; puppy.position.x = 22 + Math.sin(t * 0.13) * 6;
  clouds.forEach((c, i) => (c.position.x += Math.sin(t * 0.05 + i) * dt * 0.4));
  sparkles.forEach(s => { const k = s.userData.base * (0.75 + 0.25 * Math.sin(t * 2 + s.userData.ph)); s.scale.setScalar(k); });
  for (let i = fxList.length - 1; i >= 0; i--) { const f = fxList[i]; f.life -= dt; f.v.y -= 1.8 * dt;
    f.s.position.addScaledVector(f.v, dt); f.s.material.opacity = Math.min(1, f.life * 1.5);
    if (f.life <= 0) { scene.remove(f.s); f.s.material.dispose(); fxList.splice(i, 1); } }

}
